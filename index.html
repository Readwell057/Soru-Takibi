<html lang="tr">

<style>
:root{
  --ink:#16243D;
  --ink-soft:#3E4E6B;
  --paper:#EEF0F4;
  --card:#FFFFFF;
  --line:#D9DEE6;
  --line-soft:#E7EAF0;
  --primary:#2A4D8F;
  --primary-dark:#1D3A70;
  --primary-tint:#E6ECF8;
  --correct:#2F6B4F;
  --correct-tint:#E4F1EA;
  --wrong:#A23B3B;
  --wrong-tint:#F6E7E7;
  --blank:#8A7A3D;
  --blank-tint:#F5EFDC;
  --gold:#C68A2E;
  --sb-bg:#101A2E;
  --sb-bg2:#16223C;
  --sb-text:#EAEEF6;
  --sb-text-dim:#93A1C2;
  --sb-line:rgba(255,255,255,.09);
  --sb-hover:rgba(255,255,255,.07);
  --sb-active:#2A4D8F;
  --radius-s:6px;
  --radius-m:10px;
  --radius-l:16px;
  --shadow:0 1px 2px rgba(22,36,61,.06), 0 6px 20px rgba(22,36,61,.07);
  color-scheme: light;
  box-sizing:border-box;
  padding-top: env(safe-area-inset-top,0px);
  padding-bottom: env(safe-area-inset-bottom,0px);
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top: env(safe-area-inset-top,0px);}
html,body{height:100%;}
body{
  margin:0;
  background:var(--paper);
  color:var(--ink);
  font-family:'Public Sans',system-ui,-apple-system,sans-serif;
  font-size:15px;
  line-height:1.5;
  -webkit-font-smoothing:antialiased;
}
h1,h2,h3,h4{font-family:'Source Serif 4',Georgia,serif; margin:0; color:var(--ink); font-weight:600;}
h1{font-size:26px; letter-spacing:-.01em;}
h2{font-size:20px;}
h3{font-size:16px;}
p{margin:0;}
button{font-family:inherit; cursor:pointer;}
input,select,textarea{font-family:inherit; font-size:14px;}
a{color:var(--primary);}
::-webkit-scrollbar{width:10px; height:10px;}
::-webkit-scrollbar-thumb{background:#C7CEDA; border-radius:10px;}

.btn{
  display:inline-flex; align-items:center; justify-content:center; gap:6px;
  padding:9px 16px; border-radius:var(--radius-m); border:1px solid transparent;
  background:var(--primary); color:#fff; font-weight:600; font-size:14px;
  transition:background .15s ease, transform .05s ease;
  white-space:nowrap;
}
.btn:hover{background:var(--primary-dark);}
.btn:active{transform:scale(.98);}
.btn.secondary{background:var(--card); color:var(--ink); border-color:var(--line);}
.btn.secondary:hover{background:var(--primary-tint); border-color:var(--primary);}
.btn.ghost{background:transparent; color:var(--ink-soft); border-color:transparent; padding:8px 10px;}
.btn.ghost:hover{background:var(--line-soft);}
.btn.danger{background:var(--card); color:var(--wrong); border-color:var(--wrong);}
.btn.danger:hover{background:var(--wrong-tint);}
.btn.sm{padding:6px 11px; font-size:13px; border-radius:var(--radius-s);}
.btn:disabled{opacity:.45; cursor:not-allowed;}
.btn:focus-visible, a:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible, [tabindex]:focus-visible{
  outline:2px solid var(--primary); outline-offset:2px;
}

.field{display:flex; flex-direction:column; gap:5px; margin-bottom:12px;}
.field label{font-size:12.5px; font-weight:600; color:var(--ink-soft);}
.field input[type=text], .field input[type=number], .field select, .field textarea{
  padding:9px 11px; border:1px solid var(--line); border-radius:var(--radius-s); background:#fff; color:var(--ink);
  width:100%;
}
.field textarea{resize:vertical; min-height:80px;}
.field-row{display:flex; gap:10px;}
.field-row > .field{flex:1;}

.card{background:var(--card); border:1px solid var(--line-soft); border-radius:var(--radius-l); box-shadow:var(--shadow);}
.pad{padding:18px;}
.badge{display:inline-flex; align-items:center; padding:2px 9px; border-radius:20px; font-size:12px; font-weight:700;}
.badge.correct{background:var(--correct-tint); color:var(--correct);}
.badge.wrong{background:var(--wrong-tint); color:var(--wrong);}
.badge.blank{background:var(--blank-tint); color:var(--blank);}
.badge.gold{background:#FBF1DE; color:var(--gold);}
.badge.primary{background:var(--primary-tint); color:var(--primary);}

.pill{display:inline-flex; align-items:center; gap:5px; padding:4px 10px; border-radius:20px; background:var(--line-soft); font-size:12.5px; color:var(--ink-soft); font-weight:600;}

/* app shell */
#app{min-height:100%; display:flex; height:100%;}
.sidebar{
  width:256px; flex:none; background:linear-gradient(180deg,var(--sb-bg2),var(--sb-bg)); color:var(--sb-text);
  display:flex; flex-direction:column; height:100vh; height:100dvh;
  padding-top: env(safe-area-inset-top,0px);
  position:sticky; top:0;
}
.sidebar-brand{padding:20px 18px 16px; border-bottom:1px solid var(--sb-line); display:flex; align-items:center; gap:10px;}
.logo-mark{width:36px;height:36px;border-radius:10px;background:linear-gradient(135deg,#4368B8,#87ACEF);display:flex;align-items:center;justify-content:center;flex:none;box-shadow:0 3px 10px rgba(0,0,0,.35);}
.logo-mark svg{width:20px;height:20px;display:block;}
.sidebar-brand .brandtext{display:flex; flex-direction:column; min-width:0;}
.sidebar-brand .mark{font-family:'Source Serif 4',serif; font-size:18px; font-weight:700; color:var(--sb-text); line-height:1.2;}
.sidebar-brand .sub{font-size:11px; color:var(--sb-text-dim); margin-top:1px;}
.sidebar-section{padding:16px 14px 6px; font-size:10.5px; text-transform:uppercase; letter-spacing:.08em; color:var(--sb-text-dim); font-weight:700;}
.sidebar-list{flex:1; overflow-y:auto; padding:0 10px;}
.sidebar-item{
  display:flex; align-items:center; justify-content:space-between; gap:8px;
  padding:10px 11px; border-radius:9px; color:var(--sb-text-dim); font-size:14px; font-weight:500;
  cursor:pointer; margin-bottom:2px; border-left:3px solid transparent;
}
.sidebar-item:hover{background:var(--sb-hover); color:var(--sb-text);}
.sidebar-item.active{background:var(--sb-active); color:#fff; border-left-color:#8FB0F0;}
.sidebar-item .cnt{font-size:11px; color:var(--sb-text-dim); font-weight:600;}
.sidebar-item.active .cnt{color:#DCE5FA;}
.sidebar-footer{padding:12px; border-top:1px solid var(--sb-line); display:flex; flex-direction:column; gap:8px;}
.sidebar-newbtn{
  width:100%; padding:10px; border-radius:9px; border:1px dashed rgba(255,255,255,.28);
  background:transparent; color:var(--sb-text); font-weight:600; font-size:13.5px;
}
.sidebar-newbtn:hover{background:var(--sb-hover); border-color:rgba(255,255,255,.5);}
.sidebar-mini-actions{display:flex; gap:6px;}
.sidebar-mini-btn{flex:1; padding:8px 6px; border-radius:8px; border:1px solid var(--sb-line); background:transparent; color:var(--sb-text-dim); font-size:11.5px; font-weight:600;}
.sidebar-mini-btn:hover{background:var(--sb-hover); color:var(--sb-text);}

.mobile-topbar{display:none;}

.main{flex:1; min-width:0; height:100vh; height:100dvh; overflow-y:auto;}
.main-inner{max-width:1180px; margin:0 auto; padding:26px 26px 60px;}

.topbar{display:flex; align-items:flex-start; justify-content:space-between; gap:16px; margin-bottom:20px; flex-wrap:wrap;}
.crumb{font-size:12.5px; color:var(--ink-soft); margin-bottom:4px; font-weight:600;}
.crumb span{opacity:.55}
.actions-row{display:flex; gap:8px; flex-wrap:wrap;}

.tabs{display:flex; gap:2px; border-bottom:1px solid var(--line); margin-bottom:20px; overflow-x:auto;}
.tab{
  padding:10px 14px; font-size:13.5px; font-weight:600; color:var(--ink-soft);
  border-bottom:2px solid transparent; white-space:nowrap; cursor:pointer;
}
.tab:hover{color:var(--ink);}
.tab.active{color:var(--primary); border-bottom-color:var(--primary);}

.grid{display:grid; gap:14px;}
.grid.cols-2{grid-template-columns:1fr 1fr;}
.grid.cols-3{grid-template-columns:repeat(3,1fr);}
.grid.cols-4{grid-template-columns:repeat(4,1fr);}
@media (max-width:980px){.grid.cols-4{grid-template-columns:repeat(2,1fr);} .grid.cols-3{grid-template-columns:repeat(2,1fr);}}
@media (max-width:640px){.grid.cols-2,.grid.cols-3,.grid.cols-4{grid-template-columns:1fr;}}

table{width:100%; border-collapse:collapse; font-size:13.5px;}
canvas{display:block; max-width:100%;}
th{text-align:left; font-size:11.5px; text-transform:uppercase; letter-spacing:.04em; color:var(--ink-soft); font-weight:700; padding:8px 10px; border-bottom:1px solid var(--line);}
td{padding:9px 10px; border-bottom:1px solid var(--line-soft); vertical-align:middle;}
tr:last-child td{border-bottom:none;}
tbody tr:hover{background:var(--primary-tint);}
.table-wrap{overflow-x:auto; -webkit-overflow-scrolling:touch;}
.num{font-variant-numeric:tabular-nums;}
.right{text-align:right;}
.center{text-align:center;}

.empty{text-align:center; padding:48px 20px; color:var(--ink-soft);}
.empty h3{margin-bottom:6px; color:var(--ink);}
.empty p{font-size:13.5px; max-width:380px; margin:0 auto;}

.modal-overlay{position:fixed; inset:0; background:rgba(22,36,61,.45); display:flex; align-items:center; justify-content:center; z-index:100; padding:16px; overflow-y:auto;}
.modal{background:#fff; border-radius:var(--radius-l); width:100%; max-width:520px; max-height:90vh; overflow-y:auto; box-shadow:0 20px 60px rgba(0,0,0,.25);}
.modal.wide{max-width:900px;}
.modal-head{display:flex; align-items:center; justify-content:space-between; padding:18px 20px; border-bottom:1px solid var(--line);}
.modal-body{padding:20px;}
.modal-foot{display:flex; justify-content:flex-end; gap:8px; padding:14px 20px; border-top:1px solid var(--line);}
.close-x{background:none; border:none; font-size:20px; color:var(--ink-soft); padding:4px 8px; border-radius:6px; line-height:1;}
.close-x:hover{background:var(--line-soft);}

.toast{position:fixed; bottom:20px; left:50%; transform:translateX(-50%); background:var(--ink); color:#fff; padding:11px 18px; border-radius:10px; font-size:13.5px; font-weight:600; z-index:300; box-shadow:0 10px 30px rgba(0,0,0,.3); max-width:90vw;}

.stat-box{display:flex; flex-direction:column; gap:4px;}
.stat-box .lbl{font-size:12px; color:var(--ink-soft); font-weight:600;}
.stat-box .val{font-family:'Source Serif 4',serif; font-size:26px; font-weight:700;}

.avatar{width:34px; height:34px; border-radius:50%; background:var(--primary-tint); color:var(--primary); display:flex; align-items:center; justify-content:center; font-weight:700; font-size:13px; flex:none;}

.rank-1{color:var(--gold); font-weight:800;}
.progress-track{height:7px; background:var(--line-soft); border-radius:6px; overflow:hidden;}
.progress-fill{height:100%; border-radius:6px; background:var(--primary);}

.omr-canvaswrap{position:relative; display:inline-block; max-width:100%; touch-action:none; border-radius:var(--radius-m); overflow:hidden; border:1px solid var(--line);}
.omr-stickybar{position:sticky; top:8px; z-index:20; background:var(--card); padding:9px; border-radius:var(--radius-m); box-shadow:0 3px 10px rgba(0,0,0,.15); margin-bottom:12px; border:1px solid var(--line-soft);}
.omr-canvaswrap canvas{display:block; max-width:100%; height:auto;}
.omr-dot{position:absolute; width:22px; height:22px; margin:-11px 0 0 -11px; border-radius:50%; background:rgba(42,77,143,.85); border:2px solid #fff; box-shadow:0 1px 4px rgba(0,0,0,.4); cursor:grab;}
.omr-dot .n{position:absolute; inset:0; display:flex; align-items:center; justify-content:center; color:#fff; font-size:11px; font-weight:800;}

.chip-row{display:flex; flex-wrap:wrap; gap:6px;}
.chip{padding:5px 10px; border-radius:20px; border:1px solid var(--line); font-size:12.5px; font-weight:600; color:var(--ink-soft); cursor:pointer; background:#fff;}
.chip.active{background:var(--primary); border-color:var(--primary); color:#fff;}

.answer-grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(150px,1fr)); gap:8px;}
.answer-item{border:1px solid var(--line); border-radius:8px; padding:7px 9px; display:flex; align-items:center; gap:8px; font-size:12.5px;}
.answer-item .qn{font-weight:700; color:var(--ink-soft); width:24px; flex:none;}
.answer-item select{border:none; background:transparent; font-weight:700; flex:1;}
.answer-item.flag{border-color:var(--blank); background:var(--blank-tint);}

.help-box{background:var(--primary-tint); border:1px solid #C6D4EE; border-radius:var(--radius-m); padding:12px 14px; font-size:13px; color:var(--primary-dark);}
.help-box b{color:var(--ink);}

.backbtn{display:inline-flex; align-items:center; gap:5px; padding:7px 12px 7px 8px; border-radius:20px; border:1px solid var(--line); background:var(--card); color:var(--ink-soft); font-size:13px; font-weight:600; cursor:pointer; margin-bottom:12px;}
.backbtn:hover{background:var(--primary-tint); color:var(--primary); border-color:var(--primary);}

.clickable-card{transition:transform .12s ease, box-shadow .12s ease;}
.clickable-card:hover{transform:translateY(-2px); box-shadow:0 6px 18px rgba(22,36,61,.10), 0 14px 32px rgba(22,36,61,.09);}

.lottery-wheel{min-height:120px; display:flex; align-items:center; justify-content:center; background:linear-gradient(135deg,var(--primary-tint),var(--card)); border:1px solid var(--line); border-radius:var(--radius-l); margin-bottom:16px; padding:22px; text-align:center;}
.lottery-name{font-family:'Source Serif 4',serif; font-size:28px; font-weight:700; color:var(--primary-dark);}
.lottery-name.placeholder{color:var(--ink-soft); font-size:15px; font-weight:500; font-family:'Public Sans',sans-serif;}
@keyframes popIn{0%{transform:scale(.85);opacity:0;} 100%{transform:scale(1);opacity:1;}}
.lottery-pop{animation:popIn .25s ease;}
.lottery-pool-note{font-size:12.5px; color:var(--ink-soft); margin-bottom:10px;}

.pm-quickrow{display:flex; align-items:center; justify-content:space-between; gap:8px; padding:8px 10px; border:1px solid var(--line-soft); border-radius:9px; margin-bottom:6px;}
.pm-quickrow .qname{font-size:13.5px; font-weight:600;}
.pm-quickbtns{display:flex; gap:6px;}
.pm-qbtn{width:30px;height:30px;border-radius:8px;border:1px solid var(--line);background:var(--card);font-weight:800;font-size:15px;display:flex;align-items:center;justify-content:center; color:var(--ink-soft);}
.pm-qbtn.plus:hover{background:var(--correct-tint); color:var(--correct); border-color:var(--correct);}
.pm-qbtn.minus:hover{background:var(--wrong-tint); color:var(--wrong); border-color:var(--wrong);}

.print-only{display:none;}
@media print{
  body *{visibility:hidden;}
  #print-area, #print-area *{visibility:visible;}
  #print-area{position:absolute; left:0; top:0; width:100%;}
  .print-only{display:block;}
}

@media (max-width:900px){
  .sidebar{position:fixed; left:0; top:0; bottom:0; z-index:200; transform:translateX(-100%); transition:transform .2s ease; width:270px;}
  .sidebar.open{transform:translateX(0);}
  .mobile-topbar{
    display:flex; align-items:center; gap:10px; padding:12px 14px; background:var(--sb-bg); color:var(--sb-text);
    position:sticky; top:0; z-index:50;
  padding-top: calc(12px + env(safe-area-inset-top,0px));
  }
  .mobile-topbar button{background:rgba(255,255,255,.12); border:none; color:#fff; padding:8px 10px; border-radius:8px; font-size:16px;}
  .mobile-topbar .mtitle{font-family:'Source Serif 4',serif; font-weight:700; font-size:15px;}
  .sidebar-scrim{display:none; position:fixed; inset:0; background:rgba(0,0,0,.4); z-index:190;}
  .sidebar-scrim.show{display:block;}
  .main{height:auto;}
  .main-inner{padding:18px 14px 50px;}
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme: dark;
    --ink:#EAEEF6; --ink-soft:#AEB9CF; --paper:#121826; --card:#1B2334; --line:#2B3652; --line-soft:#232C42;
    --primary:#5C87DF; --primary-dark:#7DA0EA; --primary-tint:#1E2A47;
    --correct:#5FBF8B; --correct-tint:#173327; --wrong:#E08080; --wrong-tint:#3A1F1F; --blank:#D8C374; --blank-tint:#332B15;
  }
  :root:not([data-theme="light"]) body{background:var(--paper); color:var(--ink);}
  :root:not([data-theme="light"]) .modal{background:var(--card);}
  :root:not([data-theme="light"]) .field input, :root:not([data-theme="light"]) .field select, :root:not([data-theme="light"]) .field textarea{background:var(--card); color:var(--ink); border-color:var(--line);}
  :root:not([data-theme="light"]) .btn.secondary{background:var(--card);}
  :root:not([data-theme="light"]) .answer-item select{color:var(--ink);}
}
:root[data-theme="dark"]{
  color-scheme: dark;
  --ink:#EAEEF6; --ink-soft:#AEB9CF; --paper:#121826; --card:#1B2334; --line:#2B3652; --line-soft:#232C42;
  --primary:#5C87DF; --primary-dark:#7DA0EA; --primary-tint:#1E2A47;
  --correct:#5FBF8B; --correct-tint:#173327; --wrong:#E08080; --wrong-tint:#3A1F1F; --blank:#D8C374; --blank-tint:#332B15;
}
</style>

<body>
<div id="app"></div>
<div id="modal-root"></div>
<div id="toast-root"></div>
<input type="file" id="restore-file-input" accept="application/json" style="display:none;">

<script>
/* ============================= DATA LAYER ============================= */
const STORE_KEY = 'sinavKarnesi_v1';
const uid = () => Math.random().toString(36).slice(2,10) + Date.now().toString(36).slice(-4);

function loadData(){
  try{
    const raw = localStorage.getItem(STORE_KEY);
    if(raw){ return JSON.parse(raw); }
  }catch(e){ console.warn('Veri okunamadı', e); }
  return { classes: [], tests: [], settings: { fillThreshold: 150, blankThreshold: 195, margin: 22 } };
}
let DATA = loadData();
if(!DATA.settings) DATA.settings = { fillThreshold: 150, blankThreshold: 195, margin: 22 };

function saveData(){
  try{ localStorage.setItem(STORE_KEY, JSON.stringify(DATA)); }
  catch(e){ toast('Kaydedilemedi: depolama alanı dolu olabilir.'); }
}
function getClass(id){ return DATA.classes.find(c=>c.id===id); }
function getTest(id){ return DATA.tests.find(t=>t.id===id); }
function testsForClass(classId){ return DATA.tests.filter(t=>t.classId===classId).sort((a,b)=> (b.createdAt||0)-(a.createdAt||0)); }
function studentsForClass(cls){ return cls ? cls.students : []; }

/* ============================= ROUTER / STATE ============================= */
let ROUTE = { name:'home', params:{} };
let NAV_STACK = [];
let UI = { sidebarOpen:false, classTab:'ogrenciler', sortBy:'number', pmSortBy:'number', testSortBy:'net', omrSession:null, lotteryPopId:0 };

function nav(name, params={}){
  if(!(ROUTE.name===name && JSON.stringify(ROUTE.params)===JSON.stringify(params))){ NAV_STACK.push(ROUTE); }
  ROUTE = { name, params }; UI.sidebarOpen=false; render(); window.scrollTo(0,0);
}
function goBack(){
  if(NAV_STACK.length){ ROUTE = NAV_STACK.pop(); } else { ROUTE = { name:'home', params:{} }; }
  UI.sidebarOpen=false; render(); window.scrollTo(0,0);
}
function backButton(){ return `<button class="backbtn" data-action="goBack">← Geri</button>`; }

function toast(msg, ms=2600){
  const root = document.getElementById('toast-root');
  const el = document.createElement('div');
  el.className='toast'; el.textContent=msg;
  root.innerHTML=''; root.appendChild(el);
  setTimeout(()=>{ if(el.parentNode) el.parentNode.removeChild(el); }, ms);
}

function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

/* ============================= EXTERNAL LIBRARY LOADER (with CDN fallback) ============================= */
// Some networks block one CDN but not another; try a couple of mirrors before giving up.
function loadScriptOnce(url){
  return new Promise((resolve,reject)=>{
    const s = document.createElement('script');
    s.src = url;
    s.onload = ()=>resolve(true);
    s.onerror = ()=>reject(new Error('load failed: '+url));
    document.head.appendChild(s);
  });
}
async function ensureLib(testFn, fallbackUrls){
  if(testFn()) return true;
  for(const url of fallbackUrls){
    try{ await loadScriptOnce(url); if(testFn()) return true; }catch(e){ /* try next mirror */ }
  }
  return testFn();

/* ============================= LAYOUT / TEMPLATE GEOMETRY (A5 form, mm units) ============================= */
// One template unit == 1mm. The physical sheet handed to students is A5 (148 x 210mm);
// two copies are imposed side-by-side on an A4 landscape sheet for printing, then cut in half.
const TPL_W = 148, TPL_H = 210;
const CORNER = { size:4.6, inset:8 };
function templateCorners(){
  const i = CORNER.inset;
  return [ {x:i,y:i}, {x:TPL_W-i,y:i}, {x:TPL_W-i,y:TPL_H-i}, {x:i,y:TPL_H-i} ]; // TL, TR, BR, BL
}

function getLayout(test){
  const digits = test.numDigits, choicesN = test.numChoices, qN = test.numQuestions;
  const numberGrid = []; // [digitIndex] -> {x, cells:[{val,y}]}
  const numX0 = 10, numY0 = 48, colW = 9.4, rowH = 4.5;
  for(let d=0; d<digits; d++){
    const x = numX0 + d*colW;
    const cells = [];
    for(let v=0; v<10; v++){ cells.push({ val:v, x, y: numY0 + v*rowH }); }
    numberGrid.push({ digit:d, x, cells });
  }
  // Answer grid: fills remaining width, wraps into columns
  const areaX0 = numX0 + digits*colW + 11, areaX1 = TPL_W - 8;
  const areaY0 = 48, areaY1 = TPL_H - 7;
  const maxRows = 33;
  const idealColW = 40;
  let cols = Math.max(Math.ceil(qN / maxRows), Math.floor((areaX1-areaX0) / idealColW) || 1);
  cols = Math.max(1, Math.min(cols, Math.max(1,qN)));
  const rows = Math.ceil(qN / cols);
  const colW2 = (areaX1-areaX0) / cols;
  const rowH2 = Math.min(4.5, (areaY1-areaY0) / rows);
  const letters = ['A','B','C','D','E'].slice(0, choicesN);
  const questions = [];
  for(let q=0; q<qN; q++){
    const col = Math.floor(q / rows);
    const row = q % rows;
    const x0 = areaX0 + col*colW2 + 5.5;
    const y = areaY0 + row*rowH2;
    const bubbleGap = Math.min(5.6, (colW2-7)/choicesN);
    const choices = letters.map((L,i)=> ({ label:L, x: x0 + i*bubbleGap, y }));
    questions.push({ qIndex:q, x:areaX0+col*colW2, y, choices });
  }
  return { numberGrid, questions, numX0, numY0, areaX0, areaY0, areaX1, areaY1, colW, rowH, cols, rows,
    bubbleR:1.7, nameY:28, nameLineX0:35, nameLineX1: TPL_W-9, dividerY:32 };
}

function renderTemplateSVG(test, opts={}){
  const layout = getLayout(test);
  const corners = templateCorners();
  const cls = getClass(test.classId);
  let s = `<svg viewBox="0 0 ${TPL_W} ${TPL_H}" xmlns="http://www.w3.org/2000/svg" style="width:100%;height:auto;background:#fff;border-radius:4px;">`;
  s += `<rect x="0.5" y="0.5" width="${TPL_W-1}" height="${TPL_H-1}" fill="#fff" stroke="#ccc" stroke-width="0.3"/>`;
  corners.forEach(c=>{ s += `<rect x="${c.x-CORNER.size/2}" y="${c.y-CORNER.size/2}" width="${CORNER.size}" height="${CORNER.size}" fill="#111"/>`; });
  s += `<text x="${TPL_W/2}" y="14.5" text-anchor="middle" font-size="7" font-weight="700" font-family="Georgia,serif" fill="#111">${esc(test.name||'Sınav')}</text>`;
  s += `<text x="${TPL_W/2}" y="20" text-anchor="middle" font-size="3.6" fill="#555">${esc(cls?cls.name:'')}${test.unit?(' · '+esc(test.unit)):''}</text>`;
  s += `<text x="9" y="${layout.nameY}" font-size="3.4" font-weight="700" fill="#333">AD SOYAD:</text>`;
  s += `<line x1="${layout.nameLineX0}" y1="${layout.nameY+0.8}" x2="${layout.nameLineX1}" y2="${layout.nameY+0.8}" stroke="#999" stroke-width="0.25"/>`;
  s += `<line x1="8" y1="${layout.dividerY}" x2="${TPL_W-8}" y2="${layout.dividerY}" stroke="#ccc" stroke-width="0.25"/>`;
  s += `<text x="${layout.numX0}" y="${layout.numY0-6}" font-size="2.9" font-weight="700" fill="#333">ÖĞRENCİ NO</text>`;
  layout.numberGrid.forEach(col=>{
    col.cells.forEach(cell=>{
      s += `<circle cx="${cell.x}" cy="${cell.y}" r="${layout.bubbleR}" fill="none" stroke="#333" stroke-width="0.3"/>`;
      s += `<text x="${cell.x}" y="${cell.y+0.9}" text-anchor="middle" font-size="2.3" fill="#333">${cell.val}</text>`;
    });
  });
  s += `<text x="${layout.areaX0}" y="${layout.areaY0-6}" font-size="2.9" font-weight="700" fill="#333">CEVAPLAR</text>`;
  layout.questions.forEach(q=>{
    s += `<text x="${q.x}" y="${q.y+0.9}" font-size="2.4" font-weight="700" fill="#333">${q.qIndex+1}</text>`;
    q.choices.forEach(ch=>{
      s += `<circle cx="${ch.x}" cy="${ch.y}" r="${layout.bubbleR}" fill="none" stroke="#333" stroke-width="0.3"/>`;
      s += `<text x="${ch.x}" y="${ch.y+0.85}" text-anchor="middle" font-size="2" fill="#333">${ch.label}</text>`;
    });
  });
  s += `<text x="${TPL_W/2}" y="${TPL_H-3.5}" text-anchor="middle" font-size="2.1" fill="#999">Optik okuma formu — AD SOYAD alanını el yazısıyla doldurunuz.</text>`;
  s += `</svg>`;
  return s;
}

function drawFormOnDoc(doc, test, layout, corners, cls, xOff){
  const x = (v)=> v+xOff;
  doc.setDrawColor(20,20,20); doc.setFillColor(15,15,15);
  corners.forEach(c=>{ doc.rect(x(c.x-CORNER.size/2), c.y-CORNER.size/2, CORNER.size, CORNER.size, 'F'); });
  doc.setTextColor(0);
  doc.setFont('DejaVuSans','bold'); doc.setFontSize(13);
  doc.text(test.name||'Sınav', x(TPL_W/2), 14, { align:'center' });
  doc.setFont('DejaVuSans','normal'); doc.setFontSize(7.5); doc.setTextColor(95);
  doc.text(`${cls?cls.name:''}${test.unit?(' · '+test.unit):''}`, x(TPL_W/2), 19, { align:'center' });
  doc.setTextColor(0);
  doc.setFont('DejaVuSans','bold'); doc.setFontSize(7);
  doc.text('AD SOYAD:', x(9), layout.nameY);
  doc.setDrawColor(150); doc.setLineWidth(0.15);
  doc.line(x(layout.nameLineX0), layout.nameY+0.8, x(layout.nameLineX1), layout.nameY+0.8);
  doc.setDrawColor(205); doc.setLineWidth(0.12);
  doc.line(x(8), layout.dividerY, x(TPL_W-8), layout.dividerY);
  doc.setFont('DejaVuSans','bold'); doc.setFontSize(6.4); doc.setTextColor(45);
  doc.text('ÖĞRENCİ NO', x(layout.numX0), layout.numY0-6);
  doc.setFont('DejaVuSans','normal'); doc.setTextColor(0); doc.setDrawColor(70); doc.setLineWidth(0.12);
  layout.numberGrid.forEach(col=>{
    col.cells.forEach(cell=>{
      doc.circle(x(cell.x), cell.y, layout.bubbleR, 'S');
      doc.setFontSize(5.1);
      doc.text(String(cell.val), x(cell.x), cell.y+0.9, { align:'center' });
    });
  });
  doc.setFont('DejaVuSans','bold'); doc.setFontSize(6.4); doc.setTextColor(45);
  doc.text('CEVAPLAR', x(layout.areaX0), layout.areaY0-6);
  doc.setFont('DejaVuSans','normal'); doc.setTextColor(0);
  layout.questions.forEach(q=>{
    doc.setFontSize(5.2); doc.setFont('DejaVuSans','bold');
    doc.text(String(q.qIndex+1), x(q.x), q.y+0.9);
    doc.setFont('DejaVuSans','normal');
    q.choices.forEach(ch=>{
      doc.circle(x(ch.x), ch.y, layout.bubbleR, 'S');
      doc.setFontSize(4.4);
      doc.text(ch.label, x(ch.x), ch.y+0.8, { align:'center' });
    });
  });
  doc.setFontSize(4.3); doc.setTextColor(150);
  doc.text('Optik okuma formu — AD SOYAD alanı el yazısıyla doldurulmalıdır.', x(TPL_W/2), TPL_H-3.5, { align:'center', maxWidth: TPL_W-14 });
  doc.setTextColor(0);
}

async function downloadTemplatePDF(test, mode, printWin){
  const ok = await ensurePdfLib();
  if(!ok){ toast('PDF kütüphanesi yüklenemedi. Ağınız engelliyor olabilir.'); return; }
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF({ unit:'mm', format:'a4', orientation:'landscape' });
  usePdfFont(doc);
  const layout = getLayout(test);
  const corners = templateCorners();
  const cls = getClass(test.classId);
  drawFormOnDoc(doc, test, layout, corners, cls, 0);
  drawFormOnDoc(doc, test, layout, corners, cls, TPL_W + 1);
  doc.setDrawColor(180); doc.setLineWidth(0.15); doc.setLineDash([1.2,1.2], 0);
  doc.line(TPL_W+0.5, 3, TPL_W+0.5, TPL_H-3);
  doc.setLineDash([], 0);
  doc.setFont('DejaVuSans','normal'); doc.setFontSize(6); doc.setTextColor(150);
  doc.text('kesim çizgisi', TPL_W+0.5, TPL_H-1, { align:'center' });
  doc.setTextColor(0);
  const blob = doc.output('blob');
  await deliverPdf(blob, `${(test.name||'sinav').replace(/[^\w İıĞğÜüŞşÖöÇç-]/g,'_')}_optik_form_A5.pdf`, mode, printWin);
}

/* ============================= DOWNLOAD HELPER ============================= */
let _downloadsCap = undefined;
async function getDownloads(){
  if(_downloadsCap !== undefined) return _downloadsCap;
  try{
    if(window.claude && window.claude.use){ _downloadsCap = await window.claude.use('downloads'); }
    else { _downloadsCap = null; }
  }catch(e){ _downloadsCap = null; }
  return _downloadsCap;
}
async function offerDownload(filename, blob){
  const cap = await getDownloads();
  if(cap){
    try{
      const res = await cap.save({ filename, data: blob });
      toast(res.status==='saved' ? 'Dosya kaydedildi.' : 'Dosya gönderildi.');
      return;
    }catch(e){
      if(e && e.code==='declined'){ return; }
      console.warn('downloads.save başarısız, alternatif deneniyor', e);
    }
  }
  try{
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = filename; document.body.appendChild(a); a.click();
    setTimeout(()=>{ document.body.removeChild(a); URL.revokeObjectURL(url); }, 1000);
  }catch(e){ toast('İndirme başarısız oldu.'); }
}

// Opens a blank tab synchronously (call this directly inside the click handler,
// before any `await`) so popup blockers — especially on tablet Safari — see it as a
// direct result of the user's tap rather than an async side effect.
function openPrintWindow(){
  try{
    const w = window.open('', '_blank');
    if(w){ try{ w.document.write('<!doctype html><title>Hazırlanıyor…</title><body style="font-family:sans-serif;padding:40px;color:#555">PDF hazırlanıyor, lütfen bekleyin…</body>'); }catch(e){} }
    return w;
  }catch(e){ return null; }
}
function printPdfBlob(blob, existingWin){
  try{
    const url = URL.createObjectURL(blob);
    const win = (existingWin && !existingWin.closed) ? existingWin : window.open(url, '_blank');
    if(!win){ toast('Yazdırma penceresi açılamadı — tarayıcınız açılır pencereleri engelliyor olabilir.'); return; }
    let printed = false;
    const doPrint = ()=>{ if(printed) return; printed = true; try{ win.focus(); win.print(); }catch(e){} };
    win.addEventListener('load', doPrint);
    // Some browsers navigate straight into their built-in PDF viewer without firing 'load'.
    setTimeout(doPrint, 900);
    setTimeout(()=>{ URL.revokeObjectURL(url); }, 60000);
    if(existingWin){ win.location = url; }
  }catch(e){ toast('Yazdırma başlatılamadı.'); }
}

// mode: 'download' (default) saves/offers the file; 'print' opens it in a new tab and
// triggers the browser's print dialog so it can be sent straight to a printer.
// printWin: a window opened synchronously by openPrintWindow() at click time, if any.
async function deliverPdf(blob, filename, mode, printWin){
  if(mode === 'print'){ printPdfBlob(blob, printWin); return; }
  if(printWin && !printWin.closed){ printWin.close(); }
  await offerDownload(filename, blob);
}

/* ============================= BACKUP / RESTORE ============================= */
async function exportBackup(){
  const payload = { app:'soru-takibi', version:1, exportedAt:new Date().toISOString(), data: DATA };
  const blob = new Blob([JSON.stringify(payload, null, 2)], { type:'application/json' });
  const today = new Date().toISOString().slice(0,10);
  await offerDownload(`soru_takibi_yedek_${today}.json`, blob);
}
function importBackupFile(file){
  if(!file) return;
  const reader = new FileReader();
  reader.onload = (e)=>{
    let parsed;
    try{ parsed = JSON.parse(e.target.result); }catch(err){ toast('Dosya okunamadı: geçersiz JSON.'); return; }
    const incoming = parsed && parsed.data ? parsed.data : parsed;
    if(!incoming || !Array.isArray(incoming.classes) || !Array.isArray(incoming.tests)){ toast('Bu dosya bir Soru Takibi yedeği gibi görünmüyor.'); return; }
    if(!confirm('Bu yedeği yüklemek, bu cihazdaki MEVCUT tüm verilerin üzerine yazacak. Devam edilsin mi?')) return;
    DATA = incoming;
    if(!DATA.settings) DATA.settings = { fillThreshold: 150, blankThreshold: 195, margin: 22 };
    DATA.classes.forEach(c=>{
      if(!c.plusMinus) c.plusMinus=[];
      if(!c.lotteryPicked) c.lotteryPicked=[];
      if(c.lotteryHistory) delete c.lotteryHistory;
    });
    saveData();
    toast('Yedek başarıyla yüklendi.');
    UI.omrSession = null;
    nav('home');
  };
  reader.readAsText(file);
}

/* ============================= SCORING ============================= */
function scoreStudent(test, answers){
  let correct=0, wrong=0, blank=0;
  for(let i=0;i<test.numQuestions;i++){
    const a = answers[i];
    const key = test.answerKey[i];
    if(!a){ blank++; }
    else if(key && a===key){ correct++; }
    else { wrong++; }
  }
  const net = +(correct - wrong/(test.numChoices-1)).toFixed(2);
  const percent = test.numQuestions ? +((correct/test.numQuestions)*100).toFixed(1) : 0;
  return { correct, wrong, blank, net, percent };
}

function recomputeTestResults(test){
  Object.keys(test.results||{}).forEach(sid=>{
    const r = test.results[sid];
    const sc = scoreStudent(test, r.answers);
    Object.assign(r, sc);
  });
}

function unitSuggestions(cls, studentId){
  const tests = testsForClass(cls.id).filter(t=> t.results && t.results[studentId]);
  const byUnit = {};
  tests.forEach(t=>{
    const u = (t.unit||'Genel').trim() || 'Genel';
    const r = t.results[studentId];
    if(!byUnit[u]) byUnit[u] = { sum:0, n:0 };
    byUnit[u].sum += r.percent; byUnit[u].n += 1;
  });
  const rows = Object.keys(byUnit).map(u=> ({ unit:u, avg: byUnit[u].sum/byUnit[u].n }));
  rows.sort((a,b)=> a.avg-b.avg);
  return rows;
}
function suggestionText(unit, avg){
  if(avg < 40) return `“${unit}” konusunda ciddi bir eksiklik görünüyor (%${avg.toFixed(0)} başarı). Konuyu temel kavramlardan başlayarak tekrar etmesi, bol örnek soru çözmesi ve mümkünse birebir destek alması önerilir.`;
  if(avg < 60) return `“${unit}” konusunda belirgin bir zayıflık var (%${avg.toFixed(0)} başarı). Konu tekrarı yapıp, hatalı çıktığı soru tiplerine yönelik alıştırmalar çözmesi faydalı olur.`;
  if(avg < 75) return `“${unit}” konusunda orta düzeyde bir performans var (%${avg.toFixed(0)} başarı). Eksik kalan alt başlıkları belirleyip hedefli tekrar yapması başarıyı artırabilir.`;
  return `“${unit}” konusunda görece iyi durumda (%${avg.toFixed(0)} başarı). Bu seviyeyi korumak için düzenli tekrar önerilir.`;
}

/* ============================= HOMOGRAPHY / OMR MATH ============================= */
function solveLinear(A,b){
  const n=A.length;
  const M = A.map((row,i)=>[...row,b[i]]);
  for(let col=0; col<n; col++){
    let pivot=col;
    for(let r=col+1;r<n;r++) if(Math.abs(M[r][col])>Math.abs(M[pivot][col])) pivot=r;
    [M[col],M[pivot]]=[M[pivot],M[col]];
    const pv=M[col][col];
    if(Math.abs(pv)<1e-9) continue;
    for(let c=col;c<=n;c++) M[col][c]/=pv;
    for(let r=0;r<n;r++){
      if(r===col) continue;
      const factor=M[r][col];
      if(factor===0) continue;
      for(let c=col;c<=n;c++) M[r][c]-=factor*M[col][c];
    }
  }
  return M.map(row=>row[n]);
}
function computeHomography(srcPts, dstPts){
  const A=[], b=[];
  for(let i=0;i<4;i++){
    const {x,y}=srcPts[i], X=dstPts[i].x, Y=dstPts[i].y;
    A.push([x,y,1,0,0,0,-X*x,-X*y]); b.push(X);
    A.push([0,0,0,x,y,1,-Y*x,-Y*y]); b.push(Y);
  }
  const h = solveLinear(A,b);
  return [[h[0],h[1],h[2]],[h[3],h[4],h[5]],[h[6],h[7],1]];
}
function invert3(m){
  const [[a,b,c],[d,e,f],[g,h,i]] = m;
  const A=e*i-f*h, B=-(d*i-f*g), C=d*h-e*g;
  const D=-(b*i-c*h), E=a*i-c*g, F=-(a*h-b*g);
  const G=b*f-c*e, H=-(a*f-c*d), I=a*e-b*d;
  const det=a*A+b*B+c*C;
  if(Math.abs(det)<1e-9) return null;
  const inv=1/det;
  return [[A*inv,D*inv,G*inv],[B*inv,E*inv,H*inv],[C*inv,F*inv,I*inv]];
}
function applyH(m,x,y){
  const X=m[0][0]*x+m[0][1]*y+m[0][2];
  const Y=m[1][0]*x+m[1][1]*y+m[1][2];
  const W=m[2][0]*x+m[2][1]*y+m[2][2];
  return [X/W, Y/W];
}
function sampleDarkness(ctx, cx, cy, r, imgW, imgH){
  const size = Math.max(4, Math.round(r));
  const x0 = Math.max(0, Math.round(cx-size)), y0 = Math.max(0, Math.round(cy-size));
  const x1 = Math.min(imgW, Math.round(cx+size)), y1 = Math.min(imgH, Math.round(cy+size));
  const w = x1-x0, h = y1-y0;
  if(w<=0||h<=0) return 255;
  let data;
  try{ data = ctx.getImageData(x0,y0,w,h).data; } catch(e){ return 255; }
  let sum=0, n=0;
  for(let i=0;i<data.length;i+=4){
    sum += (data[i]*0.299 + data[i+1]*0.587 + data[i+2]*0.114);
    n++;
  }
  return n? sum/n : 255;
}

function studentOverallStat(cls, studentId, tests){
  let sum=0,n=0;
  (tests||testsForClass(cls.id)).forEach(t=>{ const r=t.results&&t.results[studentId]; if(r){ sum+=r.percent; n++; } });
  return n? sum/n : null;
}
function studentRankInClass(cls, studentId, tests){
  const list = cls.students.map(s=> ({ id:s.id, avg: studentOverallStat(cls, s.id, tests) })).filter(x=>x.avg!=null);
  if(!list.length) return null;
  list.sort((a,b)=>b.avg-a.avg);
  const idx = list.findIndex(x=>x.id===studentId);
  return idx===-1? null : idx+1;
}

/* ============================= VIEW: TEST RESULTS ============================= */
function sortTestRows(rows, sortBy){
  const arr = rows.slice();
  switch(sortBy){
    case 'name': arr.sort((a,b)=>a.s.name.localeCompare(b.s.name,'tr')); break;
    case 'number': arr.sort((a,b)=>(a.s.number||0)-(b.s.number||0)); break;
    case 'correct': arr.sort((a,b)=>b.r.correct-a.r.correct); break;
    case 'wrong': arr.sort((a,b)=>a.r.wrong-b.r.wrong); break;
    case 'percent': arr.sort((a,b)=>b.r.percent-a.r.percent); break;
    case 'entered': arr.sort((a,b)=>(b.r.enteredAt||0)-(a.r.enteredAt||0)); break;
    case 'net': default: arr.sort((a,b)=>b.r.net-a.r.net); break;
  }
  return arr;
}

async function drawStudentCharts(cls, student, tests){
  const box1 = document.getElementById('chart-progress');
  const box2 = document.getElementById('chart-dist');
  const ok = await ensureChartLib();
  if(!ok){
    if(box1) box1.parentElement.innerHTML = '<p style="color:var(--wrong);font-size:12.5px;">Grafik kütüphanesi yüklenemedi. Ağınız cdnjs.cloudflare.com veya cdn.jsdelivr.net adreslerini engelliyor olabilir.</p>';
    if(box2) box2.parentElement.innerHTML = '<p style="color:var(--wrong);font-size:12.5px;">Grafik kütüphanesi yüklenemedi. Ağınız cdnjs.cloudflare.com veya cdn.jsdelivr.net adreslerini engelliyor olabilir.</p>';
    return;
  }
  // Route may have changed while we were waiting for the library to load.
  if(ROUTE.name!=='student' || ROUTE.params.sid!==student.id) return;
  if(!tests.length) return;
  try{
    if(box1){
      const existing = Chart.getChart(box1); if(existing) existing.destroy();
      new Chart(box1, {
        type:'line',
        data:{ labels: tests.map(t=>t.name), datasets:[{ label:'Başarı (%)', data: tests.map(t=>t.results[student.id].percent), borderColor:'#2A4D8F', backgroundColor:'rgba(42,77,143,.12)', fill:true, tension:.3, pointRadius:4 }] },
        options:{ responsive:true, maintainAspectRatio:false, plugins:{legend:{display:false}}, scales:{ y:{ min:0, max:100 } } }
      });
    }
  }catch(e){ console.error('chart-progress error', e); if(box1) box1.parentElement.innerHTML = '<p style="color:var(--wrong);font-size:12.5px;">Grafik çizilemedi.</p>'; }
  try{
    if(box2){
      const existing = Chart.getChart(box2); if(existing) existing.destroy();
      const totalC = tests.reduce((s,t)=>s+t.results[student.id].correct,0);
      const totalW = tests.reduce((s,t)=>s+t.results[student.id].wrong,0);
      const totalB = tests.reduce((s,t)=>s+t.results[student.id].blank,0);
      new Chart(box2, {
        type:'doughnut',
        data:{ labels:['Doğru','Yanlış','Boş'], datasets:[{ data:[totalC,totalW,totalB], backgroundColor:['#2F6B4F','#A23B3B','#C9B65A'] }] },
        options:{ responsive:true, maintainAspectRatio:false, plugins:{legend:{position:'bottom'}} }
      });
    }
  }catch(e){ console.error('chart-dist error', e); if(box2) box2.parentElement.innerHTML = '<p style="color:var(--wrong);font-size:12.5px;">Grafik çizilemedi.</p>'; }
}

  return `

      <div class="pill">Resim ${S.idx+1} / ${S.files.length}</div>

    </div>
    <div id="omr-stage"></div>
  </div>
  `;
}

function omrStartCurrent(){
  const S = UI.omrSession;
  const file = S.files[S.idx];
  const img = new Image();
  img.onload = ()=>{
    const maxW = 1400;
    const scale = Math.min(1, maxW/img.width);
    const cw = Math.round(img.width*scale), ch = Math.round(img.height*scale);
    const canvas = document.createElement('canvas');
    canvas.width = cw; canvas.height = ch;
    const ctx = canvas.getContext('2d');
    ctx.drawImage(img,0,0,cw,ch);
    S.current = { step:'calibrate', canvas, ctx, thumb: canvas.toDataURL('image/jpeg',0.72), points: S.calib ? S.calib.map(p=>({x:p.x*cw, y:p.y*ch})) : defaultCornerGuess(cw,ch) };
    renderOmrStage();
  };
  if(file && file.type === 'pdfpage'){
    img.src = file.dataUrl;
  } else {
    const reader = new FileReader();
    reader.onload = (e)=>{ img.src = e.target.result; };
    reader.readAsDataURL(file);
  }
}

async function omrIngestFiles(files){
  toast('Dosyalar hazırlanıyor…');
  const out = [];
  for(const f of files){
    const isPdf = f.type === 'application/pdf' || /\.pdf$/i.test(f.name||'');
    if(isPdf){
      try{
        const pages = await extractPdfPages(f);
        pages.forEach((dataUrl,i)=> out.push({ type:'pdfpage', dataUrl, name: (f.name||'PDF')+' — sayfa '+(i+1) }));
      }catch(err){
        console.warn('PDF okunamadı', err);
        toast((f.name||'PDF')+' işlenemedi. Sayfaları resim olarak da yükleyebilirsiniz.');
      }
    } else if((f.type||'').startsWith('image/')){
      out.push(f);
    }
  }
  if(!out.length){ toast('Yüklenebilir bir dosya bulunamadı.'); return; }
  UI.omrSession.files = UI.omrSession.files.concat(out);
  render();
}

async function extractPdfPages(file){
  const ok = await ensurePdfJsLib();
  if(!ok){ throw new Error('pdf.js yüklenemedi'); }
  if(!window.pdfjsLib.GlobalWorkerOptions.workerSrc){
    window.pdfjsLib.GlobalWorkerOptions.workerSrc = _pdfJsMirror === 'jsdelivr'
      ? 'https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.worker.min.js'
      : 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
  }
  const buf = await file.arrayBuffer();
  const pdf = await window.pdfjsLib.getDocument({ data: buf }).promise;
  const pages = [];
  for(let p=1; p<=pdf.numPages; p++){
    const page = await pdf.getPage(p);
    const viewport = page.getViewport({ scale: 2 });
    const canvas = document.createElement('canvas');
    canvas.width = viewport.width; canvas.height = viewport.height;
    const ctx = canvas.getContext('2d');
    await page.render({ canvasContext: ctx, viewport }).promise;
    pages.push(canvas.toDataURL('image/jpeg', 0.85));
  }
  return pages;
}
function defaultCornerGuess(w,h){
  const m = 0.06;
  return [ {x:w*m,y:h*m}, {x:w*(1-m),y:h*m}, {x:w*(1-m),y:h*(1-m)}, {x:w*m,y:h*(1-m)} ];
}

function mountOmrCanvas(cur){
  const wrap = document.getElementById('omr-canvaswrap');
  wrap.innerHTML = '';
  wrap.appendChild(cur.canvas);
  cur.points.forEach((p,i)=>{
    const dot = document.createElement('div');
    dot.className = 'omr-dot';
    dot.innerHTML = `<span class="n">${i+1}</span>`;
    positionDot(dot, cur.canvas, p);
    wrap.appendChild(dot);
    let dragging = false;
    const move = (clientX, clientY)=>{
      const rect = cur.canvas.getBoundingClientRect();
      const scaleX = cur.canvas.width / rect.width, scaleY = cur.canvas.height / rect.height;
      p.x = Math.max(0, Math.min(cur.canvas.width, (clientX-rect.left)*scaleX));
      p.y = Math.max(0, Math.min(cur.canvas.height, (clientY-rect.top)*scaleY));
      positionDot(dot, cur.canvas, p);
    };
    dot.addEventListener('pointerdown', (e)=>{ dragging=true; dot.setPointerCapture(e.pointerId); });
    dot.addEventListener('pointermove', (e)=>{ if(dragging) move(e.clientX, e.clientY); });
    dot.addEventListener('pointerup', ()=>{ dragging=false; });
    dot.addEventListener('pointercancel', ()=>{ dragging=false; });
  });
}
function positionDot(dot, canvas, p){
  const rect = canvas.getBoundingClientRect();
  const w = rect.width || canvas.width, h = rect.height || canvas.height;
  dot.style.left = (p.x / canvas.width * w) + 'px';
  dot.style.top = (p.y / canvas.height * h) + 'px';
}

function omrRunDetection(cur, test){
  const dstCorners = templateCorners();
  const H = computeHomography(cur.points, dstCorners);
  const Hinv = invert3(H);
  const layout = getLayout(test);
  const settings = DATA.settings;
  // sampling radius in source-image pixels: approximate by measuring dst->src distance for a small offset
  const sampleR = 10;
  function sampleAt(tx, ty){
    const [sx, sy] = applyH(Hinv, tx, ty);
    return sampleDarkness(cur.ctx, sx, sy, sampleR, cur.canvas.width, cur.canvas.height);
  }
  // number digits
  const digits = [];
  const digitFlags = [];
  layout.numberGrid.forEach(col=>{
    const vals = col.cells.map(cell=> sampleAt(cell.x, cell.y));
    let minI=0; for(let i=1;i<vals.length;i++) if(vals[i]<vals[minI]) minI=i;
    const sorted = vals.slice().sort((a,b)=>a-b);
    const darkest = sorted[0], second = sorted[1];
    if(darkest > settings.blankThreshold){ digits.push(null); digitFlags.push(true); }
    else if(darkest < settings.fillThreshold && (second-darkest) > settings.margin){ digits.push(minI); digitFlags.push(false); }
    else { digits.push(minI); digitFlags.push(true); }
  });
  // answers
  const answers = [];
  const answerFlags = [];
  layout.questions.forEach(q=>{
    const vals = q.choices.map(ch=> sampleAt(ch.x, ch.y));
    let minI=0; for(let i=1;i<vals.length;i++) if(vals[i]<vals[minI]) minI=i;
    const sorted = vals.slice().sort((a,b)=>a-b);
    const darkest = sorted[0], second = sorted[1];
    if(darkest > settings.blankThreshold){ answers.push(null); answerFlags.push(false); }
    else if(darkest < settings.fillThreshold && (second-darkest) > settings.margin){ answers.push(q.choices[minI].label); answerFlags.push(false); }
    else { answers.push(q.choices[minI].label); answerFlags.push(true); }
  });
  const numberStr = digits.map(d=> d==null?'?':String(d)).join('');
  return { digits, digitFlags, answers, answerFlags, numberStr, H };
}

    const nameEl = document.getElementById('m-class-name');
    const name = nameEl.value.trim();
    if(!name){ toast('Sınıf adı girin'); return; }
    const c = { id:uid(), name, createdAt:Date.now(), students:[], plusMinus:[], lotteryPicked:[], notes:'' };
    DATA.classes.push(c); saveData(); closeModal(); nav('class',{classId:c.id});
    return;
  }
  if(action==='saveClass'){
    const c = getClass(el.getAttribute('data-id'));
    const name = document.getElementById('m-class-name').value.trim();
    if(!name){ toast('Sınıf adı girin'); return; }
    c.name = name; saveData(); closeModal(); render();
    return;
  }
  if(action==='deleteClass'){
    if(!confirm('Bu sınıfı ve tüm verilerini silmek istediğinize emin misiniz?')) return;
    const id = el.getAttribute('data-id');
    DATA.classes = DATA.classes.filter(c=>c.id!==id);
    DATA.tests = DATA.tests.filter(t=>t.classId!==id);
    saveData(); nav('home');
    return;
  }
  if(action==='createStudent'){
    const cid = el.getAttribute('data-cid');
    const c = getClass(cid);
    const name = document.getElementById('m-student-name').value.trim();
    const number = document.getElementById('m-student-number').value.trim();
    if(!name || !number){ toast('Ad ve numara girin'); return; }
    c.students.push({ id:uid(), name, number: parseInt(number,10) });
    saveData(); closeModal(); render();
    return;
  }
  if(action==='saveStudent'){
    const cid = el.getAttribute('data-cid'), sid = el.getAttribute('data-sid');
    const c = getClass(cid); const s = c.students.find(x=>x.id===sid);
    s.name = document.getElementById('m-student-name').value.trim();
    s.number = parseInt(document.getElementById('m-student-number').value,10);
    saveData(); closeModal(); render();
    return;
  }
  if(action==='deleteStudent'){
    if(!confirm('Öğrenciyi silmek istediğinize emin misiniz?')) return;
    const cid = el.getAttribute('data-cid'), sid = el.getAttribute('data-sid');
    const c = getClass(cid); c.students = c.students.filter(s=>s.id!==sid);
    DATA.tests.forEach(t=>{ if(t.results) delete t.results[sid]; });
    c.plusMinus = (c.plusMinus||[]).filter(e=>e.studentId!==sid);
    saveData(); render();
    return;
  }
  if(action==='createTest'){
    const cid = el.getAttribute('data-cid');
    const name = document.getElementById('m-test-name').value.trim();
    const unit = document.getElementById('m-test-unit').value.trim();
    const examDate = document.getElementById('m-test-date').value;
    const qn = parseInt(document.getElementById('m-test-qn').value,10) || 20;
    const choices = parseInt(document.getElementById('m-test-choices').value,10);
    const digits = parseInt(document.getElementById('m-test-digits').value,10);
    if(!name){ toast('Sınav adı girin'); return; }
    const t = { id:uid(), classId:cid, name, unit, examDate, numQuestions:qn, numChoices:choices, numDigits:digits, answerKey:Array(qn).fill(''), results:{}, createdAt:Date.now() };
    DATA.tests.push(t); saveData(); closeModal(); nav('test',{id:t.id});
    return;
  }
  if(action==='deleteTest'){
    if(!confirm('Bu sınavı ve tüm sonuçlarını silmek istediğinize emin misiniz?')) return;
    const id = el.getAttribute('data-id');
    DATA.tests = DATA.tests.filter(t=>t.id!==id);
    saveData(); render();
    return;
  }
  if(action==='saveAnswerKey'){
    const t = getTest(el.getAttribute('data-id'));
    document.querySelectorAll('[data-key-idx]').forEach(sel=>{
      const i = parseInt(sel.getAttribute('data-key-idx'),10);
      t.answerKey[i] = sel.value;
    });
    recomputeTestResults(t);
    saveData(); closeModal(); render();
    return;
  }
  if(action==='printTemplate'){
    const t = getTest(el.getAttribute('data-id'));
    const m = el.getAttribute('data-mode');
    const w = m==='print' ? openPrintWindow() : null;
    downloadTemplatePDF(t, m, w);
    return;
  }
  if(action==='saveNotes'){
    const c = getClass(el.getAttribute('data-id'));
    c.notes = document.getElementById('class-notes-area').value;
    saveData(); toast('Notlar kaydedildi.');
    return;
  }
  if(action==='createPM'){
    const c = getClass(el.getAttribute('data-id'));
    const studentId = document.getElementById('m-pm-student').value;
    const type = document.getElementById('m-pm-type').value;
    const date = document.getElementById('m-pm-date').value;
    const reason = document.getElementById('m-pm-reason').value.trim();
    if(!studentId){ toast('Öğrenci seçin'); return; }
    c.plusMinus = c.plusMinus || [];
    c.plusMinus.push({ id:uid(), studentId, type, date, reason });
    saveData(); closeModal(); render();
    return;
  }
  if(action==='deletePM'){
    const cid = el.getAttribute('data-cid'), eid = el.getAttribute('data-eid');
    const c = getClass(cid); c.plusMinus = (c.plusMinus||[]).filter(e=>e.id!==eid);
    saveData(); render();
    return;
  }
  if(action==='quickPM'){
    const cid = el.getAttribute('data-cid'), sid = el.getAttribute('data-sid'), type = el.getAttribute('data-type');
    const c = getClass(cid);
    c.plusMinus = c.plusMinus || [];
    c.plusMinus.push({ id:uid(), studentId:sid, type, date:new Date().toISOString().slice(0,10), reason:'' });
    saveData(); render();
    return;
  }
  if(action==='drawLottery'){
    const c = getClass(el.getAttribute('data-id'));
    c.lotteryPicked = c.lotteryPicked || [];
    const remaining = c.students.filter(s=> !c.lotteryPicked.includes(s.id));
    if(!remaining.length){ toast('Bu turda herkes zaten seçildi. Sıfırlayabilirsiniz.'); return; }
    const pick = remaining[Math.floor(Math.random()*remaining.length)];
    c.lotteryPicked.push(pick.id);
    UI.lastLotteryPick = { classId:c.id, studentId:pick.id, name:pick.name };
    saveData(); render();
    return;
  }
  if(action==='repeatLottery'){
    const c = getClass(el.getAttribute('data-id'));
    if(!c.students.length){ toast('Sınıfta öğrenci yok'); return; }
    const pick = c.students[Math.floor(Math.random()*c.students.length)];
    UI.lastLotteryPick = { classId:c.id, studentId:pick.id, name:pick.name };
    render();
    return;
  }
  if(action==='resetLottery'){
    const c = getClass(el.getAttribute('data-id'));
    c.lotteryPicked = [];
    if(UI.lastLotteryPick && UI.lastLotteryPick.classId===c.id) UI.lastLotteryPick = null;
    saveData(); toast('Kura sıfırlandı, herkes yeniden aday.'); render();
    return;
  }
  if(action==='lotteryGive'){
    const c = getClass(el.getAttribute('data-id'));
    const type = el.getAttribute('data-type');
    if(!UI.lastLotteryPick || UI.lastLotteryPick.classId!==c.id) return;
    c.plusMinus = c.plusMinus || [];
    c.plusMinus.push({ id:uid(), studentId:UI.lastLotteryPick.studentId, type, date:new Date().toISOString().slice(0,10), reason:'Kura ile verildi' });
    saveData(); toast('İşlendi.'); render();
    return;
  }
  if(action==='suggest'){
    const cid = el.getAttribute('data-cid'), sid = el.getAttribute('data-sid');
    const c = getClass(cid);
    const rows = unitSuggestions(c, sid);
    const box = document.getElementById('suggestion-box');
    if(!rows.length){ box.innerHTML = `<div class="card pad" style="margin-bottom:18px;"><p style="color:var(--ink-soft);">Öneri oluşturmak için önce sınav sonucu gerekiyor.</p></div>`; return; }
    const weakest = rows.slice(0,3);
    box.innerHTML = `<div class="card pad" style="margin-bottom:18px; border-left:4px solid var(--gold);">
      <h3 style="margin-bottom:10px;">💡 Çalışma Önerisi</h3>
      ${weakest.map(w=>`<p style="margin-bottom:8px; font-size:13.5px;">${suggestionText(w.unit, w.avg)}</p>`).join('')}
    </div>`;
    return;
  }
  if(action==='omrLoadFiles'){
    const input = document.getElementById('omr-file-input');
    const files = Array.from(input.files||[]);
    if(!files.length){ toast('Resim veya PDF seçin'); return; }
    omrIngestFiles(files);
    return;
  }
  if(action==='omrAddMore'){
    UI.omrSession.idx = 0;
    // keep existing results, but re-open file picker by resetting files to force upload screen with results preserved
    const keepResults = UI.omrSession.results;
    UI.omrSession.files = [];
    UI.omrSession.results = keepResults;
    render();
    return;
  }
  if(action==='omrConfirmCalib'){
    const S = UI.omrSession, test = getTest(S.testId);
    const cur = S.current;
    S.calib = cur.points.map(p=>({ x:p.x/cur.canvas.width, y:p.y/cur.canvas.height }));
    const det = omrRunDetection(cur, test);
    cur.detection = det;
    cur.step = 'review';
    renderOmrStage();
    return;
  }
  if(action==='omrBackToCalib'){
    const S = UI.omrSession;
    S.current.step = 'calibrate';
    renderOmrStage();
    return;
  }
  if(action==='omrSkipImage'){
    const S = UI.omrSession;
    S.idx += 1; S.current = null;
    render();
    return;
  }
  if(action==='omrConfirmReview'){
    const S = UI.omrSession, test = getTest(S.testId), cur = S.current;
    document.querySelectorAll('[data-digit-idx]').forEach(inp=>{
      const i = parseInt(inp.getAttribute('data-digit-idx'),10);
      const v = inp.value.trim();
      cur.detection.digits[i] = v===''? null : parseInt(v,10);
    });
    document.querySelectorAll('[data-ans-idx]').forEach(sel=>{
      const i = parseInt(sel.getAttribute('data-ans-idx'),10);
      cur.detection.answers[i] = sel.value || null;
    });
    const numberStr = cur.detection.digits.map(d=>d==null?'':String(d)).join('');
    const studentSel = document.getElementById('omr-student-select');
    const studentId = studentSel ? studentSel.value : '';
    S.results.push({ number:numberStr, studentId, answers: cur.detection.answers.slice() });
    S.idx += 1; S.current = null;
    render();
    return;
  }
  if(action==='omrRemoveResult'){
    const idx = parseInt(el.getAttribute('data-idx'),10);
    UI.omrSession.results.splice(idx,1);
    render();
    return;
  }
  if(action==='omrSaveAll'){
    const t = getTest(el.getAttribute('data-id'));
    const S = UI.omrSession;
    let saved=0, skipped=0;
    S.results.forEach(res=>{
      if(!res.studentId){ skipped++; return; }
      const sc = scoreStudent(t, res.answers);
      t.results[res.studentId] = Object.assign({ answers: res.answers, enteredAt: Date.now() }, sc);
      saved++;
    });
    saveData();
    UI.omrSession = null;
    toast(`${saved} sonuç kaydedildi${skipped?`, ${skipped} eşleşmediği için atlandı`:''}.`);
    nav('test', { id: t.id });
    return;
  }
  if(action==='printStudentList'){ const m=el.getAttribute('data-mode'); const w=m==='print'?openPrintWindow():null; printStudentList(getClass(el.getAttribute('data-id')), m, w); return; }
  if(action==='printPM'){ const m=el.getAttribute('data-mode'); const w=m==='print'?openPrintWindow():null; printPMList(getClass(el.getAttribute('data-id')), m, w); return; }
  if(action==='printTestResults'){ const m=el.getAttribute('data-mode'); const w=m==='print'?openPrintWindow():null; printTestResults(getTest(el.getAttribute('data-id')), m, w); return; }
  if(action==='printStudentProfile'){ const m=el.getAttribute('data-mode'); const w=m==='print'?openPrintWindow():null; printStudentProfile(getClass(el.getAttribute('data-cid')), el.getAttribute('data-sid'), m, w); return; }
}

/* ============================= PDF EXPORTS (lists) ============================= */
function pdfHeader(doc, title, subtitle){
  doc.setFont('DejaVuSans','bold'); doc.setFontSize(16); doc.text(title, 14, 18);
  if(subtitle){ doc.setFont('DejaVuSans','normal'); doc.setFontSize(10); doc.setTextColor(100); doc.text(subtitle, 14, 25); doc.setTextColor(0); }
}
function pdfTable(doc, startY, head, rows, colW){
  let y = startY;
  doc.setFontSize(9); doc.setFont('DejaVuSans','bold');
  let x = 14;
  head.forEach((h,i)=>{ doc.text(String(h), x, y); x += colW[i]; });
  y += 3; doc.setLineWidth(.2); doc.line(14, y, 196, y); y += 5;
  doc.setFont('DejaVuSans','normal');
  rows.forEach(row=>{
    if(y > 280){ doc.addPage(); usePdfFont(doc); y = 18; }
    x = 14;
    row.forEach((cell,i)=>{ doc.text(String(cell), x, y); x += colW[i]; });
    y += 6.5;
  });
  return y;
}
async function printStudentList(cls, mode, printWin){
  const ok = await ensurePdfLib();
  if(!ok){ toast('PDF kütüphanesi yüklenemedi. Ağınız engelliyor olabilir.'); return; }
  const { jsPDF } = window.jspdf; const doc = new jsPDF(); usePdfFont(doc);
  pdfHeader(doc, cls.name, `Öğrenci Listesi — ${cls.students.length} öğrenci`);
  const list = cls.students.slice().sort((a,b)=>(a.number||0)-(b.number||0));
  pdfTable(doc, 34, ['No','Ad Soyad','Ortalama'], list.map(s=>{
    const avg = studentOverallStat(cls, s.id);
    return [s.number, s.name, avg!=null?('%'+avg.toFixed(1)):'-'];
  }), [16, 120, 40]);
  await deliverPdf(doc.output('blob'), `${cls.name}_ogrenci_listesi.pdf`, mode, printWin);
}
async function printPMList(cls, mode, printWin){
  const ok = await ensurePdfLib();
  if(!ok){ toast('PDF kütüphanesi yüklenemedi. Ağınız engelliyor olabilir.'); return; }
  const { jsPDF } = window.jspdf; const doc = new jsPDF(); usePdfFont(doc);
  pdfHeader(doc, cls.name, `+ / − Listesi`);
  const list = (cls.plusMinus||[]).slice().sort((a,b)=>(b.date||'').localeCompare(a.date||''));
  pdfTable(doc, 34, ['Tarih','Öğrenci','Tür','Açıklama'], list.map(e=>{
    const s = cls.students.find(x=>x.id===e.studentId);
    return [e.date, s?s.name:'-', e.type, e.reason||''];
  }), [26, 55, 14, 90]);
  await deliverPdf(doc.output('blob'), `${cls.name}_arti_eksi_listesi.pdf`, mode, printWin);
}
async function printTestResults(test, mode, printWin){
  const cls = getClass(test.classId);
  const ok = await ensurePdfLib();
  if(!ok){ toast('PDF kütüphanesi yüklenemedi. Ağınız engelliyor olabilir.'); return; }
  const { jsPDF } = window.jspdf; const doc = new jsPDF(); usePdfFont(doc);
  pdfHeader(doc, test.name, `${cls.name} — ${test.unit||'Genel'}${test.examDate?(' — '+test.examDate):''}`);
  let rows = cls.students.map(s=>({ s, r: test.results[s.id] })).filter(x=>x.r);
  rows = sortTestRows(rows, UI.testSortBy);
  pdfTable(doc, 34, ['Sıra','Öğrenci','D','Y','B','Net','Başarı'], rows.map((x,i)=>[i+1, x.s.name, x.r.correct, x.r.wrong, x.r.blank, x.r.net, '%'+x.r.percent]), [14, 90, 12, 12, 12, 18, 20]);
  await deliverPdf(doc.output('blob'), `${test.name}_sonuclar.pdf`, mode, printWin);
}
async function printStudentProfile(cls, sid, mode, printWin){
  const student = cls.students.find(s=>s.id===sid);
  const tests = testsForClass(cls.id).filter(t=>t.results && t.results[sid]).sort((a,b)=>(a.createdAt||0)-(b.createdAt||0));
  const ok = await ensurePdfLib();
  if(!ok){ toast('PDF kütüphanesi yüklenemedi. Ağınız engelliyor olabilir.'); return; }
  const { jsPDF } = window.jspdf; const doc = new jsPDF(); usePdfFont(doc);
  pdfHeader(doc, student.name, `${cls.name} — No: ${student.number}`);
  const overall = studentOverallStat(cls, sid);
  doc.setFontSize(10); doc.text(`Genel ortalama: %${overall!=null?overall.toFixed(1):'-'}`, 14, 32);
  pdfTable(doc, 42, ['Sınav','Ünite','D','Y','B','Net','Başarı'], tests.map(t=>{
    const r = t.results[sid]; return [t.name, t.unit||'-', r.correct, r.wrong, r.blank, r.net, '%'+r.percent];
  }), [55, 45, 10, 10, 10, 16, 18]);
  const sugg = unitSuggestions(cls, sid).slice(0,3);
  let y = 42 + tests.length*6.5 + 16;
  if(y>270){ doc.addPage(); y=20; }
  if(sugg.length){
    doc.setFont('DejaVuSans','bold'); doc.setFontSize(11); doc.text('Öneriler', 14, y); y+=7;
    doc.setFont('DejaVuSans','normal'); doc.setFontSize(9);
    sugg.forEach(w=>{
      const lines = doc.splitTextToSize(suggestionText(w.unit, w.avg), 180);
      doc.text(lines, 14, y); y += lines.length*5 + 3;
    });
  }
  await deliverPdf(doc.output('blob'), `${student.name}_profil.pdf`, mode, printWin);
}

/* ============================= INIT ============================= */
const _restoreInput = document.getElementById('restore-file-input');
if(_restoreInput){ _restoreInput.addEventListener('change', (e)=>{ importBackupFile(e.target.files[0]); e.target.value=''; }); }

// PWA: service worker (offline app-shell + installability) — only meaningful once
// index.html, manifest.json, sw.js and the icons are hosted together (e.g. GitHub Pages).
// Silently does nothing in the Claude artifact preview, where sw.js isn't served.
if('serviceWorker' in navigator && (location.protocol==='https:' || location.hostname==='localhost')){
  window.addEventListener('load', ()=>{
    navigator.serviceWorker.register('sw.js').catch(()=>{});
  });
}
let _deferredInstallPrompt = null;
window.addEventListener('beforeinstallprompt', (e)=>{
  e.preventDefault();
  _deferredInstallPrompt = e;
  render();
});
window.addEventListener('appinstalled', ()=>{ _deferredInstallPrompt = null; render(); });

render();
</script>
